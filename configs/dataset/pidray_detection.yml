task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 12 # your dataset classes
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /content/dataset/PIDray/train
    ann_file: /content/dataset/PIDray/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - type: CLAHE
          clip_limit: 4.0
          tile_grid_size: [8, 8]
          p: 0.5
        
        - type: Resize_CLAHE
          size: [640, 640]
          
        - type: NormalizeImage_CLAHE
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          
        - type: Permute_CLAHE
  shuffle: True
  num_workers: 2
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /content/dataset/PIDray/test
    ann_file: /content/dataset/PIDray/annotations/test.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - type: CLAHE
          clip_limit: 4.0
          tile_grid_size: [8, 8]
          p: 0.5
        
        - type: Resize_CLAHE
          size: [640, 640]
          
        - type: NormalizeImage_CLAHE
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          
        - type: Permute_CLAHE
  shuffle: False
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
